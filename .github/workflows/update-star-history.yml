name: Update Star History Chart

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Star History SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROUTED_REPO: ${{ github.repository }}
        run: node scripts/generate-star-history.mjs

      - name: Push to Star History Branch
        run: |
          git config --local user.email "202353692+bshea-1@users.noreply.github.com"
          git config --local user.name "bshea-1"
          git checkout --orphan star-history
          git reset
          git add assets/star-history.svg
          git commit -m "update star history chart"
          git push --force origin star-history
