  <path d="M 65.0,310.0 L 79.0,278.8 L 93.0,153.8 L 107.0,112.1 L 121.0,112.1 L 135.0,101.7 L 149.0,101.7 L 163.0,101.7 L 177.0,91.3 L 191.0,91.3 L 205.0,80.8 L 219.0,80.8 L 233.0,80.8 L 247.0,80.8 L 261.0,80.8 L 275.0,80.8 L 289.0,80.8 L 303.0,80.8 L 317.0,80.8 L 331.0,80.8 L 345.0,80.8 L 359.0,80.8 L 373.0,80.8 L 387.0,80.8 L 401.0,80.8 L 415.0,80.8 L 429.0,80.8 L 443.0,70.4 L 457.0,70.4 L 471.0,70.4 L 485.0,70.4 L 499.0,70.4 L 513.0,70.4 L 527.0,70.4 L 541.0,60.0 L 555.0,60.0 L 569.0,60.0 L 583.0,60.0 L 597.0,60.0 L 611.0,60.0 L 625.0,60.0 L 639.0,60.0 L 653.0,60.0 L 667.0,60.0 L 681.0,60.0 L 695.0,60.0 L 709.0,60.0 L 723.0,60.0 L 737.0,60.0 L 751.0,60.0 L 765.0,60.0" class="data-line" />

