  <path d="M 65.0,310.0 L 81.3,278.8 L 97.6,153.8 L 113.8,112.1 L 130.1,112.1 L 146.4,101.7 L 162.7,101.7 L 179.0,101.7 L 195.2,91.3 L 211.5,91.3 L 227.8,80.8 L 244.1,80.8 L 260.3,80.8 L 276.6,80.8 L 292.9,80.8 L 309.2,80.8 L 325.5,80.8 L 341.7,80.8 L 358.0,80.8 L 374.3,80.8 L 390.6,80.8 L 406.9,80.8 L 423.1,80.8 L 439.4,80.8 L 455.7,80.8 L 472.0,80.8 L 488.3,80.8 L 504.5,70.4 L 520.8,70.4 L 537.1,70.4 L 553.4,70.4 L 569.7,70.4 L 585.9,70.4 L 602.2,70.4 L 618.5,60.0 L 634.8,60.0 L 651.0,60.0 L 667.3,60.0 L 683.6,60.0 L 699.9,60.0 L 716.2,60.0 L 732.4,60.0 L 748.7,60.0 L 765.0,60.0" class="data-line" />

