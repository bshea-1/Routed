  <path d="M 65.0,310.0 L 79.0,281.2 L 93.0,165.8 L 107.0,127.3 L 121.0,127.3 L 135.0,117.7 L 149.0,117.7 L 163.0,117.7 L 177.0,108.1 L 191.0,108.1 L 205.0,98.5 L 219.0,98.5 L 233.0,98.5 L 247.0,98.5 L 261.0,98.5 L 275.0,98.5 L 289.0,98.5 L 303.0,98.5 L 317.0,98.5 L 331.0,98.5 L 345.0,98.5 L 359.0,98.5 L 373.0,98.5 L 387.0,98.5 L 401.0,98.5 L 415.0,98.5 L 429.0,98.5 L 443.0,88.8 L 457.0,88.8 L 471.0,88.8 L 485.0,88.8 L 499.0,88.8 L 513.0,88.8 L 527.0,88.8 L 541.0,79.2 L 555.0,79.2 L 569.0,79.2 L 583.0,79.2 L 597.0,79.2 L 611.0,79.2 L 625.0,79.2 L 639.0,79.2 L 653.0,79.2 L 667.0,79.2 L 681.0,79.2 L 695.0,79.2 L 709.0,60.0 L 723.0,60.0 L 737.0,60.0 L 751.0,60.0 L 765.0,60.0" class="data-line" />

